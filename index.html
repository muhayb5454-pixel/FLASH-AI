<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Benim Yapay Zekam</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #1e1e2e;
            color: #cdd6f4;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            background-color: #181825;
            padding: 15px 20px;
            text-align: center;
            border-bottom: 1px solid #313244;
        }

        header h1 {
            font-size: 1.2rem;
            color: #cba6f7;
        }

        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
            font-size: 0.95rem;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .user-message {
            align-self: flex-end;
            background-color: #89b4fa;
            color: #11111b;
            border-bottom-right-radius: 2px;
        }

        .bot-message {
            align-self: flex-start;
            background-color: #313244;
            color: #cdd6f4;
            border-bottom-left-radius: 2px;
        }

        #input-container {
            padding: 15px 20px;
            background-color: #181825;
            display: flex;
            gap: 10px;
            border-top: 1px solid #313244;
        }

        #user-input {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #45475a;
            background-color: #1e1e2e;
            color: #cdd6f4;
            outline: none;
            font-size: 0.95rem;
        }

        #user-input:focus {
            border-color: #cba6f7;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background-color: #cba6f7;
            color: #11111b;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #b4befe;
        }
    </style>
</head>
<body>

    <header>
        <h1>🤖 Benim Yapay Zekam (Jet Hızıyla Akış)</h1>
    </header>

    <div id="chat-container">
        <div class="message bot-message">Merhaba kanka! Nasıl yardımcı olabilirim?</div>
    </div>

    <div id="input-container">
        <input type="text" id="user-input" placeholder="Yapay zekaya bir şeyler yaz..." onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()">Gönder</button>
    </div>

    <script>
        // API anahtarını buraya doğrudan tırnak içine yazıyorsun
        const API_KEY = "AQ.Ab8RN6JNUwFST5i8C9Zkcmi2Hjmk36hLZ0zs-amAvpwVNU95yg";

        async function sendMessage() {
            const inputField = document.getElementById("user-input");
            const messageText = inputField.value.trim();

            if (!messageText) return;

            appendMessage(messageText, "user-message");
            inputField.value = "";

            const botMsgId = appendMessage("", "bot-message");
            const botMsgDiv = document.getElementById(botMsgId);
            botMsgDiv.innerText = "Yazıyor...";

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:streamGenerateContent?alt=sse&key=${API_KEY}`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{ text: messageText }]
                        }]
                    })
                });

                if (!response.ok) {
                    const err = await response.json();
                    botMsgDiv.innerText = "Hata: " + (err.error?.message || "Geçersiz API Anahtarı");
                    return;
                }

                botMsgDiv.innerText = "";
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = "";

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split("\n");
                    buffer = lines.pop();

                    for (const line of lines) {
                        if (line.startsWith("data: ")) {
                            const jsonStr = line.replace("data: ", "").trim();
                            if (jsonStr === "[DONE]") continue;
                            try {
                                const parsed = JSON.parse(jsonStr);
                                const chunk = parsed.candidates?.[0]?.content?.parts?.[0]?.text;
                                if (chunk) {
                                    botMsgDiv.innerText += chunk;
                                    const chatContainer = document.getElementById("chat-container");
                                    chatContainer.scrollTop = chatContainer.scrollHeight;
                                }
                            } catch (e) {}
                        }
                    }
                }

                if (!botMsgDiv.innerText) {
                    botMsgDiv.innerText = "Yanıt boş döndü.";
                }

            } catch (error) {
                botMsgDiv.innerText = "Bağlantı hatası: " + error.message;
            }
        }

        function appendMessage(text, className) {
            const chatContainer = document.getElementById("chat-container");
            const messageDiv = document.createElement("div");
            const messageId = "msg-" + Date.now();
            messageDiv.id = messageId;
            messageDiv.className = `message ${className}`;
            messageDiv.innerText = text;
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return messageId;
        }

        function handleKeyPress(event) {
            if (event.key === "Enter") {
                sendMessage();
            }
        }
    </script>

</body>
</html>
