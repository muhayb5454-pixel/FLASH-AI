<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Benim Yapay Zekam</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #1e1e2e;
            color: #cdd6f4;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            background-color: #181825;
            padding: 15px 20px;
            text-align: center;
            border-bottom: 1px solid #313244;
        }

        header h1 {
            font-size: 1.2rem;
            color: #cba6f7;
        }

        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
            font-size: 0.95rem;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .user-message {
            align-self: flex-end;
            background-color: #89b4fa;
            color: #11111b;
            border-bottom-right-radius: 2px;
        }

        .bot-message {
            align-self: flex-start;
            background-color: #313244;
            color: #cdd6f4;
            border-bottom-left-radius: 2px;
        }

        .error-message {
            align-self: flex-start;
            background-color: #f38ba8;
            color: #11111b;
            border-bottom-left-radius: 2px;
            font-weight: bold;
        }

        #input-container {
            padding: 15px 20px;
            background-color: #181825;
            display: flex;
            gap: 10px;
            border-top: 1px solid #313244;
        }

        #user-input {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #45475a;
            background-color: #1e1e2e;
            color: #cdd6f4;
            outline: none;
            font-size: 0.95rem;
        }

        #user-input:focus {
            border-color: #cba6f7;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background-color: #cba6f7;
            color: #11111b;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #b4befe;
        }
    </style>
    <!-- Google Gen AI SDK ESM Import Map -->
    <script type="importmap">
      {
        "imports": {
          "@google/genai": "https://esm.sh/@google/genai"
        }
      }
    </script>
</head>
<body>

    <header>
        <h1>🤖 Benim Yapay Zekam (Resmi SDK & Akış)</h1>
    </header>

    <div id="chat-container">
        <div class="message bot-message">Merhaba kanka! Nasıl yardımcı olabilirim?</div>
    </div>

    <div id="input-container">
        <input type="text" id="user-input" placeholder="Yapay zekaya bir şeyler yaz..." onkeypress="if(event.key==='Enter') sendMessage()">
        <button id="send-btn">Gönder</button>
    </div>

    <script type="module">
        import { GoogleGenAI } from '@google/genai';

        const API_KEY = "AQ.Ab8RN6JNUwFST5i8C9Zkcmi2Hjmk36hLZ0zs-amAvpWVNU95yg";
        const ai = new GoogleGenAI({ apiKey: API_KEY });

        async function sendMessage() {
            const inputField = document.getElementById("user-input");
            const messageText = inputField.value.trim();

            if (!messageText) return;

            appendMessage(messageText, "user-message");
            inputField.value = "";

            const botMsgId = appendMessage("Yazıyor...", "bot-message");
            const botMsgDiv = document.getElementById(botMsgId);

            try {
                const responseStream = await ai.models.generateContentStream({
                    model: 'gemini-2.5-flash',
                    contents: messageText,
                });

                botMsgDiv.innerText = "";
                for await (const chunk of responseStream) {
                    if (chunk.text) {
                        botMsgDiv.innerText += chunk.text;
                        const chatContainer = document.getElementById("chat-container");
                        chatContainer.scrollTop = chatContainer.scrollHeight;
                    }
                }

                if (!botMsgDiv.innerText) {
                    botMsgDiv.innerText = "Yanıt boş döndü.";
                }

            } catch (error) {
                botMsgDiv.className = "message error-message";
                botMsgDiv.innerText = "Hata: " + (error.message || "İstek başarısız oldu.");
            }
        }

        function appendMessage(text, className) {
            const chatContainer = document.getElementById("chat-container");
            const messageDiv = document.createElement("div");
            const messageId = "msg-" + Date.now();
            messageDiv.id = messageId;
            messageDiv.className = `message ${className}`;
            messageDiv.innerText = text;
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return messageId;
        }

        document.getElementById("send-btn").addEventListener("click", sendMessage);
        window.sendMessage = sendMessage;
    </script>

</body>
</html>
